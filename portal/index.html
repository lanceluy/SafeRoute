<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeRoute Municipal Portal</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>SafeRoute Municipal Hazard Portal</h1>
    <form id="login-form" class="auth">
      <input type="email" id="email" placeholder="Official email" autocomplete="username" required>
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit">Log in</button>
    </form>
    <div id="session" class="auth" hidden>
      <span id="signed-in-as"></span>
      <button type="button" id="logout">Log out</button>
    </div>
  </header>

  <p id="banner" role="alert" hidden></p>

  <main>
    <section id="map-panel">
      <div id="map"></div>
      <p id="map-note" hidden></p>
    </section>
    <aside id="queue-panel">
      <div class="queue-header">
        <h2>Moderation queue</h2>
        <select id="status-filter" aria-label="Which hazards to list">
          <option value="">Active (disputed first)</option>
          <option value="RESOLVED,EXPIRED,REMOVED">Closed (resolved, expired, removed)</option>
        </select>
      </div>
      <p id="queue-summary"></p>
      <div id="hazard-list"><p class="empty">Log in with a moderator or municipal official account to view hazards.</p></div>
    </aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
