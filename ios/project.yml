name: SafeRoute
options:
  bundleIdPrefix: com.saferoute
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  SafeRoute:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SafeRoute
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: SafeRoute
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocationWhenInUseUsageDescription: "SafeRoute uses your location to show pedestrian hazards near you and to alert you as you approach one."
        NSLocationAlwaysAndWhenInUseUsageDescription: "With background hazard alerts on, SafeRoute uses your approximate location while the app is closed to warn you about hazards reported near you."
        # Keeps navigation (and its on-route alerts) running with the screen locked.
        UIBackgroundModes: [location]
        # A real iPhone reaches the backend on a Mac over plain HTTP on the local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "SafeRoute connects to the SafeRoute server on your local network."
        # Server a device build uses until one is entered on the login screen, e.g.
        # xcodebuild ... SAFEROUTE_DEFAULT_SERVER=http://my-mac.local:8080
        SafeRouteDefaultServer: $(SAFEROUTE_DEFAULT_SERVER)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saferoute.app
        TARGETED_DEVICE_FAMILY: "1"
        SAFEROUTE_DEFAULT_SERVER: ""
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_STRICT_CONCURRENCY: complete
        # APNs background alerts need the Push Notifications entitlement, which free Apple IDs
        # can't sign. With a paid team, uncomment this and regenerate (xcodegen generate); without
        # it the app still builds and runs, and alerts only arrive while it's open or navigating.
        # CODE_SIGN_ENTITLEMENTS: SafeRoute.entitlements
    scheme:
      testTargets: [SafeRouteTests]
      gatherCoverageData: false

  SafeRouteTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SafeRouteTests
    dependencies:
      - target: SafeRoute
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saferoute.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
