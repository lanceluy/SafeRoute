name: SafeRoute
options:
  bundleIdPrefix: com.saferoute
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  SafeRoute:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SafeRoute
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: SafeRoute
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocationWhenInUseUsageDescription: "SafeRoute uses your location to show pedestrian hazards near you and to alert you as you approach one."
        NSLocationAlwaysAndWhenInUseUsageDescription: "SafeRoute uses your location in the background to keep hazard alerts current while you're walking."
        UIBackgroundModes: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saferoute.app
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_STRICT_CONCURRENCY: complete
    scheme:
      testTargets: []
      gatherCoverageData: false
