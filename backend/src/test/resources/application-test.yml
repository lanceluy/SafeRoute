saferoute:
  hazard:
    expiry-check-interval: PT1H   # tests trigger expiry explicitly
  uploads:
    dir: ${java.io.tmpdir}/saferoute-test-uploads
  benchmark:
    consumer-control-enabled: true

logging:
  level:
    com.saferoute.backend: INFO
    org.springframework.kafka: WARN
    org.apache.kafka: ERROR
    org.hibernate.SQL: WARN
