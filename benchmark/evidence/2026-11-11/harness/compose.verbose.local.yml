services:
  backend:
    build:
      dockerfile_inline: |
        FROM eclipse-temurin:21-jdk AS build
        WORKDIR /app
        COPY .mvn/ .mvn/
        COPY mvnw pom.xml ./
        COPY src/ src/
        RUN ./mvnw -B package -DskipTests

        FROM eclipse-temurin:21-jre
        WORKDIR /app
        COPY --from=build /app/target/saferoute-backend.jar app.jar
        EXPOSE 8080
        ENTRYPOINT ["java", "-jar", "app.jar"]
