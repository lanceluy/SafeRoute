services:
  postgres:
    container_name: saferoute-icbim-postgres
    ports: !reset []
  kafka:
    container_name: saferoute-icbim-kafka
    ports: !reset []
  backend:
    container_name: saferoute-icbim-backend
    ports: !override
      - "127.0.0.1:18080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker,benchmark
